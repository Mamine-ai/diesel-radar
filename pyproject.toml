[project]
name = "diesel-radar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mamine-ai" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "holidays>=0.108",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "lxml>=6.1.3",
    "mlflow>=3.18.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "prefect>=3.9.3",
    "pulp>=4.2.0",
    "pyarrow>=26.0.1",
    "pydeck>=0.9.3",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.67.0",
]

[project.scripts]
diesel-radar = "diesel_radar:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
